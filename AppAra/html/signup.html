<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Parent Account - Ara</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <img src="../images/AraLogo.png" alt="Ara Logo">
            <h1>Create Account</h1>
            <p>Join Ara to book an assessment for your child</p>
        </div>

        <div id="successMessage" class="form-success"></div>
        <div id="errorBanner" class="form-error" style="display: none;"></div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label class="form-label" for="username">Username (optional)</label>
                <input 
                    type="text" 
                    id="username" 
                    class="form-input" 
                    placeholder="Leave blank to use First+Last"
                    aria-label="Username (optional)"
                >
                <div class="error-message" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="firstName">First Name *</label>
                <input 
                    type="text" 
                    id="firstName" 
                    class="form-input" 
                    placeholder="First name"
                    aria-label="First name"
                    required
                >
                <div class="error-message" id="firstNameError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="lastName">Last Name *</label>
                <input 
                    type="text" 
                    id="lastName" 
                    class="form-input" 
                    placeholder="Last name"
                    aria-label="Last name"
                    required
                >
                <div class="error-message" id="lastNameError"></div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-input" 
                    placeholder="your.email@example.com"
                    required
                    aria-label="Email address"
                >
                <div class="error-message" id="emailError"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password *</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Minimum 8 characters, A-Z, a-z, 0-9"
                    required
                    aria-label="Password"
                >
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password *</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="form-input" 
                    placeholder="Re-enter your password"
                    required
                    aria-label="Confirm password"
                >
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span>Create Account</span>
                </button>
                <a href="login.html" class="btn btn-secondary" aria-label="Back to Login">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Login</span>
                </a>
            </div>
        </form>

        <div id="confirmationScreen" class="confirmation-container" style="display: none;">
            <h2>Check your email!</h2>
            <p>We've sent a login link to verify and access your dashboard.</p>
            <div style="margin-top: 12px; display: flex; gap: 12px; justify-content: center;">
                <button class="btn btn-secondary" id="resendBtn"><i class="fas fa-envelope"></i><span>Resend Email</span></button>
                <a href="login.html" class="btn btn-primary" id="goToLoginBtn"><span>Go to Login</span></a>
            </div>
        </div>

        <div class="signup-footer">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>

    <!-- Core helper scripts (load in order) -->
    <script src="../js/config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/tokenManager.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/signup.js"></script>
</body>
</html>

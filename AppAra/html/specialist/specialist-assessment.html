<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialist - Assessment Management - ARA</title>
    <link rel="stylesheet" href="../../css/specialist-assessment.css">
    <style></style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <h1>👨‍⚕️ Assessment Management</h1>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-info-name" id="userName">Specialist</div>
                    <div class="user-info-role">Specialist</div>
                </div>
                <button class="logout-btn" onclick="Auth.logout()">Logout</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Success/Error Messages -->
        <div id="successMessage" class="success-message" style="display: none;"></div>
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('for-assessment')">
                📋 For Assessment (<span id="forAssessmentCount">0</span>)
            </button>
            <button class="tab-button" onclick="switchTab('in-progress')">
                ⏳ In Progress (<span id="inProgressCount">0</span>)
            </button>
            <button class="tab-button" onclick="switchTab('completed')">
                ✅ Completed (<span id="completedCount">0</span>)
            </button>
        </div>

        <!-- Tab: For Assessment -->
        <div id="for-assessment" class="tab-content active">
            <h2 class="section-title">Students Ready for Assessment</h2>
            <div class="filter-bar">
                <input 
                    type="text" 
                    id="forAssessmentSearch" 
                    class="filter-input" 
                    placeholder="Search by student name or grade..."
                    onkeyup="filterStudents('for-assessment')"
                >
            </div>
            <div id="for-assessmentList" class="students-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading students...
                </div>
            </div>
        </div>

        <!-- Tab: In Progress -->
        <div id="in-progress" class="tab-content">
            <h2 class="section-title">Assessments In Progress</h2>
            <div class="filter-bar">
                <input 
                    type="text" 
                    id="inProgressSearch" 
                    class="filter-input" 
                    placeholder="Search by student name or grade..."
                    onkeyup="filterStudents('in-progress')"
                >
            </div>
            <div id="in-progressList" class="students-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading students...
                </div>
            </div>
        </div>

        <!-- Tab: Completed -->
        <div id="completed" class="tab-content">
            <h2 class="section-title">Completed Assessments</h2>
            <div class="filter-bar">
                <input 
                    type="text" 
                    id="completedSearch" 
                    class="filter-input" 
                    placeholder="Search by student name or grade..."
                    onkeyup="filterStudents('completed')"
                >
            </div>
            <div id="completedList" class="students-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading students...
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/tokenManager.js"></script>
    <script src="../../js/pages/specialist-assessment.js"></script>
</body>
</html>
